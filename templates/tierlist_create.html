{% extends 'base.html' %}
{% block title %}Create Tier List — AniPulse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px">
  <h3 class="fw-bold mb-2">🏆 Create Tier List</h3>
  <p class="text-secondary small mb-4">Name your list and start ranking anime!</p>
  <form method="post"><div class="mb-3"><label class="form-label fw-medium">Title</label><input type="text" name="title" class="form-control form-control-custom" placeholder="Best Anime Ever..." required></div>{% csrf_token %}<button type="submit" class="btn btn-primary-custom w-100 py-2" style="border-radius:12px">Create</button></form>
</div>
{% endblock %}
