{% extends 'base.html' %}{% load static %}
{% block title %}Password Reset — AniPulse{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon success"><i class="fas fa-check-circle"></i></div>
        <h1>Password changed!</h1>
        <p class="auth-sub">Your password has been reset successfully.</p>
      </div>
      <a href="{% url 'login' %}" class="auth-btn"><i class="fas fa-sign-in-alt"></i> Sign in with new password</a>
    </div>
  </div>
</div>
{% endblock %}
