{% extends 'base.html' %}{% load static %}
{% block title %}Reset Password — AniPulse{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-lock"></i></div>
        <h1>Forgot password?</h1>
        <p class="auth-sub">No worries — we'll send you a reset link</p>
      </div>
      <form method="post" class="auth-form" id="resetForm" onsubmit="var btn=this.querySelector('button[type=submit],input[type=submit]');if(btn)btn.disabled=true">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email"><i class="fas fa-envelope"></i> Email address</label>
          <input type="email" name="email" id="id_email" class="form-input" placeholder="your@email.com" required autocomplete="email">
          <span class="input-highlight"></span>
        </div>
        {% if form.errors %}
        <div class="auth-error"><i class="fas fa-exclamation-circle"></i> {{ form.errors.email.0 }}</div>
        {% endif %}
        <button type="submit" class="auth-btn"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
      </form>
      <div class="auth-footer">
        <a href="{% url 'login' %}" class="auth-link"><i class="fas fa-arrow-left"></i> Back to sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
