{% extends 'base.html' %}{% load core_extras %}
{% block title %}Settings — AniPulse{% endblock %}
{% block extra_css %}
<style>
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px;max-width:640px;margin:0 auto}
.settings-card h5{margin-bottom:20px;font-weight:600}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:0.85rem;font-weight:500;margin-bottom:6px;color:var(--text-secondary)}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;font-size:0.9rem;outline:none;transition:border-color 0.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary)}
.form-group textarea{min-height:80px;resize:vertical}
.form-check{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.form-check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--primary)}
.form-check label{font-size:0.9rem;cursor:pointer}
</style>
{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="settings-card">
    <h5><i class="fas fa-cog me-2"></i>Account Settings</h5>
    <form method="post" onsubmit="var btn=this.querySelector('button[type=submit],input[type=submit]');if(btn)btn.disabled=true">
      {% csrf_token %}
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}">
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea name="bio">{{ user.bio|surrogatefree }}</textarea>
      </div>
      <div class="form-group">
        <label>Avatar URL</label>
        <input type="url" name="avatar" value="{{ user.avatar }}" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Cover Image URL</label>
        <input type="url" name="cover_image" value="{{ user.cover_image }}" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Timezone</label>
        <select name="timezone">
          <option value="UTC" {% if user.timezone == 'UTC' %}selected{% endif %}>UTC</option>
          <option value="US/Eastern" {% if user.timezone == 'US/Eastern' %}selected{% endif %}>US/Eastern</option>
          <option value="US/Central" {% if user.timezone == 'US/Central' %}selected{% endif %}>US/Central</option>
          <option value="US/Pacific" {% if user.timezone == 'US/Pacific' %}selected{% endif %}>US/Pacific</option>
          <option value="Europe/London" {% if user.timezone == 'Europe/London' %}selected{% endif %}>Europe/London</option>
          <option value="Europe/Berlin" {% if user.timezone == 'Europe/Berlin' %}selected{% endif %}>Europe/Berlin</option>
          <option value="Asia/Tokyo" {% if user.timezone == 'Asia/Tokyo' %}selected{% endif %}>Asia/Tokyo</option>
          <option value="Asia/Seoul" {% if user.timezone == 'Asia/Seoul' %}selected{% endif %}>Asia/Seoul</option>
          <option value="Asia/Shanghai" {% if user.timezone == 'Asia/Shanghai' %}selected{% endif %}>Asia/Shanghai</option>
          <option value="Australia/Sydney" {% if user.timezone == 'Australia/Sydney' %}selected{% endif %}>Australia/Sydney</option>
        </select>
      </div>
      <hr style="border-color:var(--border);margin:24px 0">
      <h6 class="mb-3">Notifications</h6>
      <div class="form-check">
        <input type="checkbox" name="notify_new_episodes" id="notify1" {% if user.notify_new_episodes %}checked{% endif %}>
        <label for="notify1">New episodes of anime I'm watching</label>
      </div>
      <div class="form-check">
        <input type="checkbox" name="notify_airing" id="notify2" {% if user.notify_airing %}checked{% endif %}>
        <label for="notify2">Airing schedule reminders</label>
      </div>
      <button type="submit" class="btn btn-primary-custom w-100 mt-3 py-2">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
