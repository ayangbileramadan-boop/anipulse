<div class="d-flex gap-3 align-items-start">
  <a href="{% url 'profile' item.user.username %}" class="text-decoration-none flex-shrink-0">
    {% if item.user.avatar %}
      <img src="{{ item.user.avatar }}" alt="" class="rounded-circle" width="36" height="36">
    {% else %}
      <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white fw-bold" style="width:36px;height:36px;font-size:14px">{{ item.user.username|first|upper }}</div>
    {% endif %}
  </a>
  <div class="flex-grow-1 min-w-0">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <a href="{% url 'profile' item.user.username %}" class="fw-semibold text-decoration-none" style="color:var(--text);font-size:0.9rem">{{ item.user.username }}</a>
      <span class="text-muted" style="font-size:0.75rem">{{ item.timestamp|timesince }} ago</span>
    </div>
    <div style="font-size:0.9rem;color:var(--text-secondary)">
      ⚔️ Voted in battle:
    </div>
    <div class="d-flex align-items-center gap-2 mt-1">
      <div class="small fw-medium text-truncate" style="color:var(--text);font-size:0.8rem">{{ item.content.anime1.title|default:"Anime" }}</div>
      <span class="badge" style="background:var(--primary);font-size:0.6rem">VS</span>
      <div class="small fw-medium text-truncate" style="color:var(--text);font-size:0.8rem">{{ item.content.anime2.title|default:"Anime" }}</div>
    </div>
  </div>
</div>
