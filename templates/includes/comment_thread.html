<div class="comment-thread mt-3" data-ctype="{{ ctype }}" data-oid="{{ oid }}" id="comment-thread-{{ oid }}-{{ ctype|slugify }}"{% if lazy %} data-lazy="1"{% endif %}>
  <h6 class="fw-bold mb-3">Comments <span class="text-muted comment-count" id="comment-count-{{ oid }}">0</span></h6>

  <div id="comment-list-{{ oid }}" class="comment-list"></div>

  <div class="comment-loading text-center py-4" id="comment-loading-{{ oid }}">
    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
  </div>

  {% if user.is_authenticated %}
  <div class="comment-form-wrap mt-4 pt-3 border-top">
    <div class="d-flex gap-2 align-items-start">
      {% if user.avatar %}
        <img src="{{ user.avatar }}" alt="" class="comment-avatar-sm rounded-circle flex-shrink-0" width="32" height="32">
      {% else %}
        <div class="comment-avatar-sm rounded-circle bg-secondary flex-shrink-0 d-flex align-items-center justify-content-center" style="width:32px;height:32px;font-size:14px;color:#fff">{{ user.username|first|upper }}</div>
      {% endif %}
      <div class="flex-grow-1">
        <textarea class="form-control comment-textarea" id="comment-input-{{ oid }}" rows="2" placeholder="Add a comment..." maxlength="2000" style="font-size:14px;resize:none"></textarea>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <label class="small text-muted d-flex align-items-center gap-1" style="cursor:pointer">
            <input type="checkbox" class="spoiler-check" id="spoiler-check-{{ oid }}"> <span>Spoiler</span>
          </label>
          <button class="btn btn-sm comment-submit-btn" data-ctype="{{ ctype }}" data-oid="{{ oid }}" style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:6px 18px;font-size:13px;font-weight:500">Post</button>
        </div>
      </div>
    </div>
  </div>
  {% else %}
  <div class="mt-4 pt-3 border-top text-center">
    <p class="text-muted mb-0 small"><a href="{% url 'login' %}" class="text-decoration-none" style="color:var(--primary)">Log in</a> to comment</p>
  </div>
  {% endif %}
</div>
