{% extends 'base.html' %}
{% block title %}Login — AniPulse{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="airing-card p-4">
                <h3 class="fw-bold text-center mb-4">Sign In</h3>
                <form method="post">{% csrf_token %}
                    {% if form.errors %}
                    <div class="alert alert-danger small">Invalid username or password.</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Username</label>
                        <input type="text" name="username" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" name="password" class="form-control form-control-custom" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2">Sign In</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-secondary">Don't have an account? <a href="{% url 'register' %}" class="text-danger text-decoration-none">Sign up</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
