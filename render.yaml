services:
  - type: web
    name: anipulse
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
      python manage.py seed_all
    startCommand: gunicorn config.wsgi --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: ADMIN_USERNAME
        value: makaveli
      - key: ADMIN_PASSWORD
        value: makaveli456
      - key: ADMIN_EMAIL
        value: ayangbileramadan@gmail.com
